<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4 relative overflow-hidden">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_#e2e8f0_0%,_#f8fafc_45%,_#f1f5f9_100%)]"></div>
  <div class="absolute -top-24 -right-24 h-72 w-72 rounded-full bg-primary-200/40 blur-3xl"></div>
  <div class="absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-slate-300/50 blur-3xl"></div>

  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6">
    <div class="text-center space-y-3">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-slate-900 text-white font-extrabold text-xl tracking-tight">
        M
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">MeetSpace</h1>
        <p class="text-sm text-slate-500 mt-1">Sign in to book and manage meeting rooms</p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border border-red-100 p-4 rounded-xl flex items-start space-x-3">
      <svg class="h-5 w-5 text-red-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <span class="text-sm text-red-700">{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@company.com"
          class="mt-1 w-full px-4 py-2.5 rounded-xl border bg-slate-50 focus:bg-white transition outline-none focus:ring-2 focus:ring-primary-500"
          [ngClass]="{
            'border-red-300 focus:ring-red-500': email?.invalid && (email?.dirty || email?.touched),
            'border-slate-200': !email?.invalid || (!email?.dirty && !email?.touched)
          }"
        />
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-xs text-red-500 mt-1">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="mt-1 w-full px-4 py-2.5 rounded-xl border bg-slate-50 focus:bg-white transition outline-none focus:ring-2 focus:ring-primary-500"
          [ngClass]="{
            'border-red-300 focus:ring-red-500': password?.invalid && (password?.dirty || password?.touched),
            'border-slate-200': !password?.invalid || (!password?.dirty && !password?.touched)
          }"
        />
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-xs text-red-500 mt-1">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading || loginForm.invalid"
        class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl transition shadow-lg shadow-slate-900/10 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="text-center pt-1">
      <p class="text-sm text-slate-600">
        Don't have an account?
        <a routerLink="/register" class="font-semibold text-primary-600 hover:text-primary-700 transition">Create an account</a>
      </p>
    </div>
  </div>
</div>
