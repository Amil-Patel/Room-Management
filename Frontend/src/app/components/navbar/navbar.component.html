<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center space-x-8">
        <div class="flex-shrink-0 flex items-center space-x-2">
          <span class="p-2 bg-primary-600 text-white rounded-lg font-bold text-xl">M</span>
          <span class="font-extrabold text-xl tracking-tight text-slate-800">MeetSpace</span>
        </div>
        <nav class="hidden md:flex space-x-1">
          <a routerLink="/dashboard" 
             [ngClass]="activeTab === 'dashboard' ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-slate-600 hover:text-slate-800 hover:bg-slate-100 font-medium'"
             class="px-3 py-2 text-sm rounded-lg transition">
            Dashboard
          </a>
          <a routerLink="/bookings" 
             [ngClass]="activeTab === 'bookings' ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-slate-600 hover:text-slate-800 hover:bg-slate-100 font-medium'"
             class="px-3 py-2 text-sm rounded-lg transition">
            My Bookings
          </a>
          <a *ngIf="currentUser?.is_admin" 
             routerLink="/admin" 
             [ngClass]="activeTab === 'admin' ? 'bg-purple-50 text-purple-700 font-semibold' : 'text-slate-600 hover:text-slate-800 hover:bg-slate-100 font-medium'"
             class="px-3 py-2 text-sm rounded-lg transition flex items-center space-x-1">
            <span class="px-1.5 py-0.5 text-[10px] bg-purple-600 text-white rounded font-bold uppercase">Admin</span>
            <span>Portal</span>
          </a>
        </nav>
      </div>
      <div class="flex items-center space-x-3">
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-sm font-semibold text-slate-700 flex items-center space-x-1">
            <span>{{ currentUser?.full_name }}</span>
            <span *ngIf="currentUser?.is_admin" class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-bold uppercase border border-purple-200">Admin</span>
          </span>
          <span class="text-xs text-slate-400 font-medium">{{ currentUser?.email }}</span>
        </div>
        <button (click)="logout()" class="hidden sm:inline-flex px-4 py-2 text-sm font-medium text-slate-600 hover:text-red-600 hover:bg-red-50 rounded-xl transition border border-slate-200 items-center space-x-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span>Logout</span>
        </button>
        <button type="button" class="md:hidden p-2 rounded-lg border border-slate-200 text-slate-600" (click)="mobileNavOpen = !mobileNavOpen" aria-label="Toggle menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!mobileNavOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="mobileNavOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div *ngIf="mobileNavOpen" class="md:hidden pb-4 space-y-1 border-t border-slate-100 pt-3">
      <a routerLink="/dashboard" (click)="mobileNavOpen = false" 
         [ngClass]="activeTab === 'dashboard' ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 font-medium'"
         class="block px-3 py-2 text-sm rounded-lg">
        Dashboard
      </a>
      <a routerLink="/bookings" (click)="mobileNavOpen = false" 
         [ngClass]="activeTab === 'bookings' ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 font-medium'"
         class="block px-3 py-2 text-sm rounded-lg">
        My Bookings
      </a>
      <a *ngIf="currentUser?.is_admin" routerLink="/admin" (click)="mobileNavOpen = false" 
         [ngClass]="activeTab === 'admin' ? 'bg-purple-50 text-purple-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 font-medium'"
         class="block px-3 py-2 text-sm rounded-lg">
        Admin Portal
      </a>
      <button (click)="logout()" class="w-full text-left px-3 py-2 text-sm font-medium rounded-lg text-red-600 hover:bg-red-50">Logout</button>
    </div>
  </div>
</header>
